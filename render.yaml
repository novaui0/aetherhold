services:
  - type: web
    name: aetherhold
    runtime: python
    plan: free
    buildCommand: echo "no dependencies"
    startCommand: python server.py --no-wizard --no-browser --max-players 16 --slots 32
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: AETHERHOLD_ADMIN_PASSWORD
        sync: false
      - key: AETHERHOLD_ADMIN_KEY
        sync: false
